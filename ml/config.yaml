data:
  csv_path: original.csv
  # Held-out evaluation split, applied before any detector is fitted.
  #
  # The detectors are unsupervised and the dataset carries no label, so this
  # cannot measure detection accuracy -- there is no such number. What it
  # measures is whether a threshold frozen on the training rows still cuts the
  # contamination rate on rows the detector never saw. A rate that holds means
  # the threshold generalises; one that drifts means it was fitted to noise.
  #
  # The shipped bundle is refitted on 100% afterwards, the same way
  # ml/explain/surrogate.py scores its held-out AUC and then refits.
  split:
    train: 0.70
    validation: 0.20
    test: 0.10

detectors:
  contamination: 0.05
  random_state: 42
  isolation_forest:
    n_estimators: 200
  lof:
    n_neighbors: 20
  one_class_svm:
    kernel: rbf
    gamma: scale
    nu: 0.05
  dbscan:
    eps: 3.0
    min_samples: 5
  mcd: {}
  gmm:
    n_components: 5
    covariance_type: full
  kmeans:
    n_clusters: 8
    n_init: 10

ensemble:
  threshold: 0.5

surrogate:
  min_auc: 0.95
  test_size: 0.25

validation:
  sane_band: [0.03, 0.07]

# PCA is the dimensionality reduction step behind the figures: it feeds the
# t-SNE embedding, the 2-D projections every structure plot is drawn on, and the
# reconstruction-error diagnostic. Only ml.viz reads these.
viz:
  pca_components: 0.95
  max_embedding_rows: 2000

storage:
  local_dir: artifacts

