substitutions:
  _REGION: us-central1
  _REPO: anomaly
  _SERVICE: anomaly-api
  _BUCKET: ""
  # SHORT_SHA is only populated for repository-triggered builds; `gcloud
  # builds submit` uploads a bare tarball, so it would resolve to "" and
  # produce an invalid image tag. The README passes a real value.
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=1
      - --min-instances=1
      - --max-instances=1
      - --set-env-vars=ANOMALY_ARTIFACT_SOURCE=gcs,ANOMALY_GCS_BUCKET=${_BUCKET},ANOMALY_TRANSACTION_LOG=firestore

options:
  logging: CLOUD_LOGGING_ONLY
